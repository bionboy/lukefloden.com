<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<style>
	html {
		background: #f0f;
	}
	body {
		margin: 0;
		font: 20px system-ui;
		color: #fff;
		background: url(photo.jpg) center/cover;
	}
	p {
		margin: 0 20px 40px;
		text-shadow: 0 0 4px #000;
	}
</style>
<title>popover</title>
<style>
	#pp {
		position: fixed;
		inset: -200px 0 auto 0;
		margin: 0;
		border: 0;
		padding: 0;
		width: auto;
		height: 420px;
		background: url(photo.jpg) center/cover;
		opacity: 0.85;
		pointer-events: none;
	}
</style>
<div id="pp" popover="manual"></div>
<script>
	pp.showPopover();
</script>
<script>
	document.write(
		'<p>' + Array.from({ length: 60 }, (_, i) => 'Line ' + i).join('</p><p>') + '</p>'
	);
</script>
<script src="hud.js"></script>
