	</style>
	<rect class="bg" width="32" height="32" />
	<g class="fg">
		<!-- L -->
		<rect x="4.4" y="6" width="4.4" height="20" />
		<rect x="4.4" y="21.6" width="9.2" height="4.4" />
		<!-- F -->
		<rect x="16.4" y="6" width="4.4" height="20" />
		<rect x="16.4" y="6" width="11.2" height="4.4" />
		<rect x="16.4" y="13.8" width="8.8" height="4.4" />
	</g>
</svg>
