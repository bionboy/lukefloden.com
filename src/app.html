<!doctype html>
<html lang="en-us">
	<head>
		<title>Luke Floden</title>

		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, user-scalable=1, viewport-fit=cover"
		/>
		<meta
			name="description"
			content="Luke Floden's personal site. Web demos, a portfolio, and a short about page."
		/>
		<meta name="robots" content="index, follow" />
		<!-- css and tw color --accent -->
		<meta name="theme-color" content="hsl(48 96% 53%)" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="hsl(240 100% 70%)" media="(prefers-color-scheme: dark)" />

		<!-- TODO: should i set something like this, does SvelteKit do this? -->
		<!-- <meta http-equiv="content-security-policy" content="default-src https:" /> -->

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<link rel="manifest" href="/site.webmanifest" />

		<!--
		25-02-03 (@bionboy): Turning this off because SEO report from lighthouse says this is bad... 
		<link rel="canonical" href="https://www.lukefloden.me" />
	-->

		<meta property="og:title" content="Luke Floden" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Luke Floden" />
		<meta property="og:locale" content="en_US" />
		<meta
			property="og:description"
			content="Luke Floden's personal site. Web demos, a portfolio, and a short about page."
		/>
		<meta property="og:url" content="https://www.lukefloden.com" />
		<meta property="og:image" content="https://www.lukefloden.com/social-card.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Blue angular mark from Luke Floden's animation." />

		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Luke Floden" />
		<meta
			name="twitter:description"
			content="Luke Floden's personal site. Web demos, a portfolio, and a short about page."
		/>
		<meta name="twitter:url" content="https://www.lukefloden.com" />
		<meta name="twitter:image" content="https://www.lukefloden.com/social-card-square.png" />
		<meta name="twitter:image:alt" content="Blue angular mark from Luke Floden's animation." />
		<meta name="twitter:creator" content="@lukefloden" />

		<!-- Fediverse: -->
		<!-- Mastodon.social identity verification -->
		<link rel="me" href="https://mastodon.social/@lukefloden" />
		<!-- TODO: add other fediverse accounts here -->

		%sveltekit.head%
	</head>

	<body
		data-sveltekit-preload-data="hover"
		style="/* background-color: hsl(240, 100%, 70%); */ /* min-height:100vh; */ margin: 0px"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
